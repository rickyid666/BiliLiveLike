plugins {
    id 'com.android.application'
}

// 固定签名: 从环境变量读取 (CI 里由仓库 Secret 注入), 没配置就退回 debug 签名
def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
def keyPass = System.getenv("ANDROID_KEY_PASSWORD")
def hasSigning = ksPath != null && ksPass != null && keyAlias != null && keyPass != null
        && file(ksPath).exists()

android {
    namespace 'com.rickyid666.bililivelike'
    compileSdk 34

    defaultConfig {
        applicationId "com.rickyid666.bililivelike"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAlias
                keyPassword keyPass
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ["META-INF/*"]
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
