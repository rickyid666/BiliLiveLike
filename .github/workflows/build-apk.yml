name: Build APK

# 发布 Release 需要写权限
permissions:
  contents: write

on:
  # 手动触发: 仓库 Actions 页面点 Run workflow
  workflow_dispatch:
  # 改到 android/ 就自动构建 (tag 推送不受路径过滤影响)
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 直接用 runner 预装的 Android SDK (setup-android 这个 action 已失效)
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # 固定签名 (可选): 仓库配置了 Secret 就用 release 签名, 否则退回 debug
      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::notice::未配置签名 Secret, 本次构建 debug 包 (装新版需先卸载旧版)"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore decoded: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$ANDROID_KEYSTORE_PATH" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "==> 使用固定签名构建 release 包"
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
            APK=app/build/outputs/apk/release/app-release.apk
          else
            echo "==> 未配置签名, 回退 debug 包"
            gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$APK" ../BiliLiveLike.apk
          ls -l ../BiliLiveLike.apk

      # 构建失败时把关键错误行贴成提交评论 (便于无人值守排查)
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/report.py" <<'PYEOF'
          import json, os, re, urllib.request

          log_path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "build.log")
          lines = []
          if os.path.exists(log_path):
              with open(log_path, encoding="utf-8", errors="replace") as f:
                  lines = f.read().splitlines()

          keep = []
          pat = re.compile(r"(error:|error;|FAILURE:|What went wrong|Caused by|Execution failed|> Task .*FAILED|\.java:\d+|symbol|BUILD FAILED)")
          for ln in lines:
              if pat.search(ln):
                  keep.append(ln.rstrip())

          if not keep:
              keep = [l.rstrip() for l in lines[-40:]]
          text = "\n".join(keep[-60:])[:6500] or "(构建日志为空)"

          body = {"body": "APK 构建失败，关键日志：\n\n```\n" + text + "\n```"}
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("comment posted:", r.status)
          except Exception as e:
              print("post failed:", e)
          PYEOF
          python3 "$RUNNER_TEMP/report.py"

      - name: Upload Artifact (Actions 页面可下载)
        uses: actions/upload-artifact@v4
        with:
          name: BiliLiveLike-apk
          path: BiliLiveLike.apk
          if-no-files-found: error

      - name: Create GitHub Release (仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BiliLiveLike.apk
          generate_release_notes: false
