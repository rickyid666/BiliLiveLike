name: Build EXE

on:
  # 手动触发: 仓库 Actions 页面点 Run workflow
  workflow_dispatch:
  # 推送 v 开头的标签时自动构建并发布 Release
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests qrcode pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name BiliLiveLike --clean bili_like_api.py

      - name: Upload Artifact (每次构建都可在 Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: BiliLiveLike-windows-x64
          path: dist/BiliLiveLike.exe
          if-no-files-found: error

      - name: Create GitHub Release (仅打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliLiveLike.exe
          generate_release_notes: true
