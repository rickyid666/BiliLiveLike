name: Verify

# 每次改动先过"安全扫描 + 自动化测试", 构建/发布工作流依赖这个结果
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests "qrcode[pil]"

      - name: Checks (安全扫描 + 自动化测试)
        run: |
          set -o pipefail
          {
            echo "=== 安全扫描 ==="
            python tools/security_scan.py --all
            echo "=== 自动化测试 ==="
            python -m unittest discover -s tests -v
          } 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Report errors on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/report_ci_failure.py
