name: Verify

# 每次改动先过"安全扫描 + 自动化测试", 构建/发布工作流依赖这个结果
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  # 需要 write 才能把失败日志贴成提交评论 (仅用于失败上报; 扫描/测试本身只读)
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests "qrcode[pil]"

      - name: Security scan (凭据/密钥/私人信息)
        run: python tools/security_scan.py --all 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Tests (调度器 / 网页版 / 命令行 / 扫描器)
        run: python -m unittest discover -s tests -v 2>&1 | tee -a "$RUNNER_TEMP/check.log"

      - name: Report errors on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/report_ci_failure.py
